name: Build WebVM coding image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vm-image/**"
      - ".github/workflows/vm-image.yml"

concurrency:
  group: sparkrun-vm-image
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the immutable recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read and validate image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 1 and
            .status == "candidate" and
            .architecture == "linux/386" and
            .distribution == "Alpine Linux 3.24.1" and
            .alpineBranch == "v3.24" and
            .criticalPackages == {
              "nodejs": "24.18.1-r0",
              "npm": "11.12.1-r0",
              "pnpm": "11.20.0-r0",
              "yarn": "1.22.22-r1",
              "python3": "3.14.7-r1",
              "py3-pip": "26.1.2-r0",
              "pipx": "1.14.0-r0",
              "go": "1.26.3-r0"
            } and
            (.imageSizeMiB >= 600 and .imageSizeMiB <= 1900) and
            (.diskFile | endswith(".ext2"))
          ' vm-image/image.json >/dev/null
          echo "disk_file=$(jq -r .diskFile vm-image/image.json)" >> "$GITHUB_OUTPUT"
          echo "image_version=$(jq -r .version vm-image/image.json)" >> "$GITHUB_OUTPUT"
          echo "image_size_mib=$(jq -r .imageSizeMiB vm-image/image.json)" >> "$GITHUB_OUTPUT"

      - name: Build pinned linux/386 toolchain container
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/386 \
            --file vm-image/Dockerfile \
            --tag sparkrun-coding:${{ steps.metadata.outputs.image_version }} \
            .

      - name: Verify and inventory the container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vm-image-build
          docker run --rm --platform linux/386 \
            sparkrun-coding:${{ steps.metadata.outputs.image_version }} \
            /usr/local/bin/sparkrun-toolchain-check --json --smoke \
            | tee vm-image-build/toolchain.json
          jq -e '
            .smokePassed == true and
            (.architecture == "x86" or .architecture == "i386") and
            (.libc | test("musl"; "i")) and
            (.bashBinary | test("ELF 32-bit.*Intel (i386|80386)"; "i")) and
            .tools.node.status == 0 and .tools.node.version == "v24.18.1" and
            .tools.npm.status == 0 and .tools.npm.version == "11.12.1" and
            .tools.pnpm.status == 0 and .tools.pnpm.version == "11.20.0" and
            .tools.yarn.status == 0 and .tools.yarn.version == "1.22.22" and
            .tools.python.status == 0 and .tools.python.version == "Python 3.14.7" and
            .tools.pip.status == 0 and (.tools.pip.version | startswith("pip 26.1.2 ")) and
            .tools.pipx.status == 0 and .tools.pipx.version == "1.14.0" and
            .tools.go.status == 0 and (.tools.go.version | startswith("go version go1.26.3 "))
          ' vm-image-build/toolchain.json >/dev/null
          docker run --rm --platform linux/386 \
            sparkrun-coding:${{ steps.metadata.outputs.image_version }} \
            apk info -vv \
            | LC_ALL=C sort > vm-image-build/packages.txt
          docker version > vm-image-build/docker-version.txt

      - name: Export the root filesystem
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker create --platform linux/386 \
            sparkrun-coding:${{ steps.metadata.outputs.image_version }})
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p vm-image-build/rootfs
          docker export "$container_id" | tar -C vm-image-build/rootfs -xf -
          docker rm "$container_id" >/dev/null
          trap - EXIT

          used_kib=$(du -sk vm-image-build/rootfs | awk '{print $1}')
          capacity_kib=$(( ${{ steps.metadata.outputs.image_size_mib }} * 1024 ))
          if (( used_kib > capacity_kib * 88 / 100 )); then
            echo "Root filesystem uses ${used_kib} KiB; image capacity is ${capacity_kib} KiB." >&2
            echo "Keep at least 12% free for package and runtime metadata." >&2
            exit 1
          fi
          echo "$used_kib" > vm-image-build/rootfs-used-kib.txt
          find vm-image-build/rootfs -xdev \
            -printf '%P\t%y\t%m\t%U\t%G\t%s\t%l\n' \
            | LC_ALL=C sort > vm-image-build/rootfs-manifest.txt

      - name: Create and validate the CheerpX ext2 image
        shell: bash
        env:
          DISK_FILE: ${{ steps.metadata.outputs.disk_file }}
          IMAGE_SIZE_MIB: ${{ steps.metadata.outputs.image_size_mib }}
        run: |
          set -euo pipefail
          disk_path="vm-image-build/${DISK_FILE}"
          truncate -s "${IMAGE_SIZE_MIB}M" "$disk_path"
          mkfs.ext2 -F -r 0 -b 4096 -L SPARKRUN \
            -d vm-image-build/rootfs "$disk_path"
          e2fsck -fn "$disk_path"
          debugfs -R 'stat /usr/local/bin/sparkrun-toolchain-check' "$disk_path" \
            | tee vm-image-build/ext2-check.txt
          grep -q 'Type: regular' vm-image-build/ext2-check.txt
          (cd vm-image-build && sha256sum "$DISK_FILE") \
            | tee vm-image-build/disk.sha256

      - name: Create release provenance
        shell: bash
        env:
          DISK_FILE: ${{ steps.metadata.outputs.disk_file }}
        run: |
          set -euo pipefail
          disk_sha=$(cut -d' ' -f1 vm-image-build/disk.sha256)
          dockerfile_sha=$(sha256sum vm-image/Dockerfile | cut -d' ' -f1)
          packages_sha=$(sha256sum vm-image-build/packages.txt | cut -d' ' -f1)
          rootfs_manifest_sha=$(sha256sum vm-image-build/rootfs-manifest.txt | cut -d' ' -f1)
          jq \
            --arg diskSha256 "$disk_sha" \
            --arg dockerfileSha256 "$dockerfile_sha" \
            --arg packageInventorySha256 "$packages_sha" \
            --arg rootfsManifestSha256 "$rootfs_manifest_sha" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson rootfsUsedKiB "$(cat vm-image-build/rootfs-used-kib.txt)" \
            --slurpfile toolchain vm-image-build/toolchain.json \
            '. + {
              diskSha256: $diskSha256,
              dockerfileSha256: $dockerfileSha256,
              packageInventorySha256: $packageInventorySha256,
              rootfsManifestSha256: $rootfsManifestSha256,
              sourceCommit: $sourceCommit,
              publishedAt: $publishedAt,
              rootfsUsedKiB: $rootfsUsedKiB,
              toolchain: $toolchain[0]
            }' vm-image/image.json > vm-image-build/manifest.json
          cat > vm-image-build/release-notes.md <<EOF
          SparkRun WebVM coding image ${{ steps.metadata.outputs.image_version }}.

          This immutable release contains the 32-bit x86 ext2 base image plus its
          SHA-256, exact Alpine package inventory, normalized filesystem manifest,
          Docker builder version, toolchain smoke result, and build provenance.

          The browser-readable copy is promoted to Firebase Hosting only after the
          same image passes the CheerpX-in-Chrome runtime gate.
          EOF

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISK_FILE: ${{ steps.metadata.outputs.disk_file }}
          IMAGE_VERSION: ${{ steps.metadata.outputs.image_version }}
        run: |
          set -euo pipefail
          tag="vm-image-${IMAGE_VERSION}"
          assets=(
            "vm-image-build/${DISK_FILE}"
            "vm-image-build/disk.sha256"
            "vm-image-build/manifest.json"
            "vm-image-build/packages.txt"
            "vm-image-build/rootfs-manifest.txt"
            "vm-image-build/docker-version.txt"
            "vm-image-build/toolchain.json"
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets > vm-image-build/existing-release.json 2>/dev/null; then
            tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              git fetch --no-tags --depth=1 origin "$tag_sha"
              if ! git diff --quiet "$tag_sha" "$GITHUB_SHA" -- \
                vm-image/Dockerfile vm-image/image.json vm-image/bin; then
                echo "Release ${tag} points to different filesystem recipe inputs; bump image version." >&2
                exit 1
              fi
              echo "Release ${tag} was built from the same filesystem recipe inputs; continuing after non-recipe changes."
            fi
            if [[ "$(jq -r .isDraft vm-image-build/existing-release.json)" == "false" ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                > vm-image-build/published-release.json
              for asset in "${assets[@]}"; do
                asset_name=$(basename "$asset")
                expected_size=$(stat --format=%s "$asset")
                published_size=$(jq -r --arg name "$asset_name" \
                  '.assets[] | select(.name == $name) | .size' \
                  vm-image-build/published-release.json)
                if [[ ! "$published_size" =~ ^[1-9][0-9]*$ ]]; then
                  echo "Published ${asset_name} is missing or empty." >&2
                  exit 1
                fi
                if [[ "$asset_name" == "$DISK_FILE" && "$published_size" != "$expected_size" ]]; then
                  echo "Published ${asset_name} has the wrong image size." >&2
                  exit 1
                fi
              done
              checksum_asset_id=$(jq -r \
                '.assets[] | select(.name == "disk.sha256") | .id' \
                vm-image-build/published-release.json)
              published_disk_digest=$(jq -r --arg name "$DISK_FILE" \
                '.assets[] | select(.name == $name) | .digest' \
                vm-image-build/published-release.json)
              [[ "$checksum_asset_id" =~ ^[0-9]+$ ]]
              curl --silent --show-error --fail --location \
                --header "Accept: application/octet-stream" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --output vm-image-build/published-disk.sha256 \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${checksum_asset_id}"
              published_checksum=$(awk -v file="$DISK_FILE" \
                '$2 == file || $2 == "*" file {print $1}' \
                vm-image-build/published-disk.sha256)
              [[ "$published_checksum" =~ ^[a-f0-9]{64}$ ]]
              [[ "$published_disk_digest" == "sha256:${published_checksum}" ]]
              echo "Immutable release ${tag} already exists with the expected assets."
              exit 0
            fi
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SparkRun WebVM image ${IMAGE_VERSION}" \
              --notes-file vm-image-build/release-notes.md \
              --draft
          fi

          gh release upload "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            > vm-image-build/draft-release.json
          for asset in "${assets[@]}"; do
            asset_name=$(basename "$asset")
            expected_size=$(stat --format=%s "$asset")
            expected_digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            uploaded_size=$(jq -r --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .size' \
              vm-image-build/draft-release.json)
            uploaded_digest=$(jq -r --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .digest' \
              vm-image-build/draft-release.json)
            if [[ "$uploaded_size" != "$expected_size" || "$uploaded_digest" != "$expected_digest" ]]; then
              echo "Draft ${asset_name} is missing or does not match the built artifact." >&2
              exit 1
            fi
          done

          disk_asset_id=$(jq -r --arg name "$DISK_FILE" \
            '.assets[] | select(.name == $name) | .id' \
            vm-image-build/draft-release.json)
          [[ "$disk_asset_id" =~ ^[0-9]+$ ]]
          draft_status=$(curl --silent --show-error --fail --location \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --range 1024-1087 \
            --output vm-image-build/draft-superblock.bin \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${disk_asset_id}")
          [[ "$draft_status" == "206" ]]
          [[ "$(stat --format=%s vm-image-build/draft-superblock.bin)" == "64" ]]
          [[ "$(od -An -tx1 -j56 -N2 vm-image-build/draft-superblock.bin | tr -d ' \n')" == "53ef" ]]

          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest=false

      - name: Verify release byte ranges and ext2 magic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISK_FILE: ${{ steps.metadata.outputs.disk_file }}
          IMAGE_VERSION: ${{ steps.metadata.outputs.image_version }}
        run: |
          set -euo pipefail
          tag="vm-image-${IMAGE_VERSION}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/vm-image-${IMAGE_VERSION}/${DISK_FILE}"
          if ! {
            status=$(curl --silent --show-error --fail --location \
              --retry 8 --retry-all-errors \
              --range 1024-1087 \
              --output vm-image-build/superblock.bin \
              --write-out '%{http_code}' \
              "$release_url")
            [[ "$status" == "206" ]]
            [[ "$(stat --format=%s vm-image-build/superblock.bin)" == "64" ]]
            [[ "$(od -An -tx1 -j56 -N2 vm-image-build/superblock.bin | tr -d ' \n')" == "53ef" ]]
          }; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=true
            echo "Published range verification failed; ${tag} was returned to draft." >&2
            exit 1
          fi
